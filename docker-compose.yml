services:

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: garagebid
      POSTGRES_PASSWORD: garagebid
    ports:
      - "5433:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data

  auction-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auction
      POSTGRES_USER: garagebid
      POSTGRES_PASSWORD: garagebid
    ports:
      - "5434:5432"
    volumes:
      - auction-db-data:/var/lib/postgresql/data

volumes:
  catalog-db-data:
  auction-db-data: