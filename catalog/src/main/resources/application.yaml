server:
  port: 8081

spring:
  application:
    name: catalog-service

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        prefer-ip-address: true
        ip-address: 127.0.0.1
        instance-id: ${spring.application.name}-${server.port}
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        query-passing: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/catalog}
    username: ${DB_USERNAME:garagebid}
    password: ${DB_PASSWORD:garagebid}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  mvc:
    problemdetails:
      enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: catalog-auction-projection-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record

garagebid:
  kafka:
    auction-events-topic: garagebid.auction.events
    auction-events-dlt-topic: garagebid.auction.events.DLT

management:
  endpoints:
    web:
      exposure:
        include: health,info