server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        prefer-ip-address: true
        ip-address: 127.0.0.1
        instance-id: ${spring.application.name}-${server.port}
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        query-passing: true

    gateway:
      server:
        webflux:
          routes:
            - id: catalog-route
              uri: lb://catalog-service
              predicates:
                - Path=/api/v1/cars/**
            - id: auction-route
              uri: lb://auction
              predicates:
                - Path=/api/v1/auctions/**

management:
  endpoint:
    gateway:
      access: read-only

  endpoints:
    web:
      exposure:
        include:
          - health
          - gateway